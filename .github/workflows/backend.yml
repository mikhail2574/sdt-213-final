name: Backend and frontend

on:
  push:
    branches: [main, feat/complete-core-platform]
  pull_request:
    branches: [main]

jobs:
  backend-h2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Core_Platform_Admin_App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: Core_Platform_Admin_App/backend/pom.xml
      - run: mvn -B verify

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: core_platform_test
          MYSQL_USER: core_platform
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/core_platform_test
      TEST_DATABASE_USER: core_platform
      TEST_DATABASE_PASSWORD: test_password
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root_password
    defaults:
      run:
        working-directory: Core_Platform_Admin_App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: Core_Platform_Admin_App/backend/pom.xml
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Core_Platform_Admin_App/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Core_Platform_Admin_App/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
