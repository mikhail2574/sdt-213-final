server.port=${PORT:8000}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/core_platform}
spring.datasource.username=${DATABASE_USER:core_platform}
spring.datasource.password=${DATABASE_PASSWORD:core_dev_password}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
springdoc.swagger-ui.path=/docs
app.jwt-secret=${JWT_SECRET:development-only-signing-key-change-me-before-deploying}
app.environment=${APP_ENV:development}
app.seed-demo=${SEED_DEMO:1}
app.email-link-base=${EMAIL_LINK_BASE:http://127.0.0.1:5173/email-link}
app.mail-enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.modules.sis.key=${SIS_MODULE_KEY:}
app.modules.lms.key=${LMS_MODULE_KEY:}
app.modules.scheduling.key=${SCHEDULING_MODULE_KEY:}
app.modules.admissions.key=${ADMISSIONS_MODULE_KEY:}
app.modules.sis.url=${SIS_MODULE_URL:}
app.modules.lms.url=${LMS_MODULE_URL:}
app.modules.scheduling.url=${SCHEDULING_MODULE_URL:}
app.modules.admissions.url=${ADMISSIONS_MODULE_URL:}
server.tomcat.max-http-form-post-size=1MB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.task.scheduling.pool.size=3
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.user=${FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}
app.audit-async=${AUDIT_ASYNC:true}
app.audit-pipeline-enabled=${AUDIT_PIPELINE_ENABLED:true}
app.modules.sis.web-url=${SIS_MODULE_WEB_URL:}
app.modules.lms.web-url=${LMS_MODULE_WEB_URL:}
app.modules.scheduling.web-url=${SCHEDULING_MODULE_WEB_URL:}
app.modules.admissions.web-url=${ADMISSIONS_MODULE_WEB_URL:}
